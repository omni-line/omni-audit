name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.20 is the minimum declared in go.mod; keep it tested.
        go-version: ["1.20.x", "1.22.x"]
        os: [ubuntu-latest]
        include:
          # Go 1.22 binaries lack LC_UUID and are rejected by current macOS dyld.
          - go-version: stable
            os: macos-latest
          - go-version: "1.22.x"
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify modules
        run: go mod verify

      - name: Format check
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*'))
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      # Measure coverage without -race. Scope to ./internal/... so cmd/ and
      # scripts/ (no tests) are not reported as 0% on Go 1.22+. Linux-only:
      # PowerShell splits -coverprofile=coverage.out.
      - name: Coverage gate
        if: runner.os == 'Linux' && matrix.go-version == '1.22.x'
        run: |
          go test -coverprofile=coverage.out -count=1 ./internal/...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "total: ${total}% (minimum 80%)"
          awk -v t="$total" 'BEGIN { if ((t+0) < 80) { printf "coverage %.1f%% is below 80%%\n", t; exit 1 } }'

      - name: Build
        run: go build ./cmd/omni-audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.x"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v1.61.0

  vuln:
    # Uses the latest stable Go, the same toolchain release binaries are built
    # with, so standard-library advisories are checked against what ships.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  action:
    # Runs the composite action from this checkout against a fixture with
    # known findings, on every runner OS it supports.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action
        id: audit
        uses: ./
        with:
          path: testdata/registry-config
          args: --no-typosquat --no-malicious --ignore 'acme-*' --fail-on none
          sarif: "true"

      - name: Check SARIF
        shell: bash
        env:
          EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
          SARIF_FILE: ${{ steps.audit.outputs.sarif-file }}
        run: |
          set -euo pipefail
          test "$EXIT_CODE" = 0
          grep -q '"ruleId": "OA005"' "$SARIF_FILE"
